<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharat Pi Food</title>
    <!-- Pi SDK -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
    <div class="container">
        <h1>Bharat Pi Food Menu</h1>
        <div class="menu">
            <div class="menu-item">
                <h3>Samosa</h3>
                <p>Price: 0.50 Pi</p>
                <button onclick="addToCart('Samosa', 0.50)">Add to Cart</button>
            </div>
            <div class="menu-item">
                <h3>Burger</h3>
                <p>Price: 1.00 Pi</p>
                <button onclick="addToCart('Burger', 1.00)">Add to Cart</button>
            </div>
        </div>

        <div class="cart-section">
            <h2>Your Cart</h2>
            <ul id="cart"></ul>
            <p id="total">Total Pi: 0</p>
            <button onclick="checkout()">Pay with Pi</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
